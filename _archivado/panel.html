<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jarvis - Panel</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #05070d; color: #d8f6ff; font-family: 'Courier New', monospace; }
  body { display: flex; min-height: 100vh; }

  #sidebarAgentes { width: 130px; flex-shrink: 0; background: #070a12; border-right: 1px solid #00e5ff22; padding: 16px 10px; }
  #sidebarAgentes h3 { font-size: 10px; letter-spacing: 2px; color: #00e5ff77; margin: 0 0 12px 4px; text-transform: uppercase; font-weight: normal; }
  .agente { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; margin-bottom: 6px; border: 1px solid transparent; }
  .agente.activo { background: #00e5ff14; border-color: #00e5ff44; }
  .agente.bloqueado { opacity: 0.35; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; background: #00e5ff22; border: 1px solid #00e5ff55; }
  .agente-nombre { font-size: 11px; color: #d8f6ff; }
  .agente-estado { font-size: 9px; color: #00e5ff88; }
  .agente.bloqueado .agente-estado { color: #ffffff55; }

  #main { flex: 1; padding: clamp(12px, 3vw, 22px); min-width: 0; }
  #main h1 { font-size: clamp(15px, 3vw, 18px); letter-spacing: 3px; margin: 0 0 18px 2px; color: #00e5ff; }

  .card-h { display: flex; align-items: center; gap: 14px; background: linear-gradient(120deg, #0d1220 0%, #070a12 100%); border: 1px solid var(--acento, #00e5ff33); border-radius: 14px; padding: 14px 18px; box-shadow: 0 0 18px -10px var(--acento, #00e5ff55); margin-bottom: 12px; }
  .card-h .icono { font-size: 26px; flex-shrink: 0; }
  .card-h .info { flex: 1; min-width: 0; }
  .card-h h2 { margin: 0 0 2px 0; font-size: 14px; color: var(--acento, #00e5ff); letter-spacing: 1px; }
  .card-h p.desc { margin: 0; font-size: 11.5px; color: #d8f6ff88; }
  .estado { font-size: 10px; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; flex-shrink: 0; }
  .estado.vinculado { color: #7ee2a8; }

  .card-nueva { border-style: dashed; opacity: 0.5; justify-content: center; }
  .card-nueva .icono { font-size: 20px; color: #00e5ff; }

  @media (max-width: 640px) {
    body { flex-direction: column; }
    #sidebarAgentes { width: auto; display: flex; align-items: center; gap: 8px; overflow-x: auto; border-right: none; border-bottom: 1px solid #00e5ff22; padding: 10px; }
    #sidebarAgentes h3 { display: none; }
    .agente { flex-shrink: 0; margin-bottom: 0; }
    .agente-nombre, .agente-estado { display: none; }
  }
</style>
</head>
<body>

<div id="sidebarAgentes">
  <h3>Agentes</h3>
  <div class="agente activo">
    <div class="avatar">🤖</div>
    <div><div class="agente-nombre">JARVIS</div><div class="agente-estado">● Activo</div></div>
  </div>
  <div class="agente bloqueado">
    <div class="avatar">➕</div>
    <div><div class="agente-nombre">Nuevo</div><div class="agente-estado">Próximamente</div></div>
  </div>
</div>

<div id="main">
  <h1>🎛️ PANEL</h1>

  <div class="card-h" style="--acento:#00e5ff; cursor:pointer;" onclick="if(window.parent) window.parent.mostrarVista('chat');">
    <div class="icono">🤖</div>
    <div class="info">
      <h2>OFICINA DE JARVIS</h2>
      <p class="desc">Tocá para chatear con el asistente</p>
    </div>
    <span class="estado vinculado">Activo</span>
  </div>

  <div class="card-h card-nueva">
    <div class="icono">+</div>
    <div class="info"><h2 style="color:#00e5ff88;">Nuevo agente</h2><p class="desc">Próximamente</p></div>
  </div>

</div>

</body>
</html>
