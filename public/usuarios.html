<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jarvis - Usuarios</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #05070d; color: #d8f6ff; font-family: 'Courier New', monospace; }
  body { padding: clamp(14px, 4vw, 24px); }
  h1 { font-size: clamp(15px, 3vw, 18px); letter-spacing: 3px; margin: 0 0 18px 2px; color: #c084fc; }

  .fila-usuario { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #ffffff11; font-size: 12.5px; }
  .fila-usuario:last-child { border-bottom: none; }
  .badge-rol { font-size: 10px; padding: 3px 9px; border-radius: 999px; border: 1px solid #d8f6ff44; color: #d8f6ff99; text-align: center; }
  .badge-rol.admin { border-color: #7ee2a8; color: #7ee2a8; }
  button { background: #c084fc; color: #05070d; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 11px; font-family: 'Courier New', monospace; font-weight: bold; }
  .btn-eliminar { background: #7a2323 !important; color: #ffd8d8 !important; }
  .alerta { color: #ff8a8a; }
  .desc { color: #d8f6ff88; font-size: 12px; }
</style>
</head>
<body>

<h1>👥 USUARIOS</h1>
<div id="lista-usuarios">Cargando...</div>

<script>
async function cargarUsuarios() {
  const cont = document.getElementById('lista-usuarios');
  cont.innerHTML = 'Cargando...';
  try {
    const resp = await fetch('/api/usuarios');
    if (!resp.ok) throw new Error('No se pudo cargar la lista de usuarios');
    const data = await resp.json();

    if (!data.usuarios.length) {
      cont.innerHTML = '<p class="desc">No hay usuarios invitados registrados todavía.</p>';
      return;
    }

    let html = '';
    for (const u of data.usuarios) {
      const esAdmin = u.rol === 'administrador';
      html += `
        <div class="fila-usuario">
          <span>${u.usuario}</span>
          <span class="badge-rol ${esAdmin ? 'admin' : ''}">${u.rol}</span>
          <button onclick="cambiarRol('${u.usuario}', '${esAdmin ? 'usuario' : 'administrador'}')">
            ${esAdmin ? 'Quitar admin' : 'Hacer admin'}
          </button>
          <button class="btn-eliminar" onclick="eliminarUsuario('${u.usuario}')">Eliminar</button>
        </div>`;
    }
    cont.innerHTML = html;
  } catch (e) {
    cont.innerHTML = `<span class="alerta">${e.message}</span>`;
  }
}

async function cambiarRol(usuario, nuevoRol) {
  try {
    const resp = await fetch(`/api/usuarios/${usuario}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ rol: nuevoRol })
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      throw new Error(data.error || 'No se pudo actualizar el rol');
    }
    cargarUsuarios();
  } catch (e) {
    alert(e.message);
  }
}

async function eliminarUsuario(usuario) {
  if (!confirm(`¿Eliminar al usuario "${usuario}"? Esta acción no se puede deshacer.`)) return;
  try {
    const resp = await fetch(`/api/usuarios/${usuario}`, { method: 'DELETE' });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      throw new Error(data.error || 'No se pudo eliminar');
    }
    cargarUsuarios();
  } catch (e) {
    alert(e.message);
  }
}

window.addEventListener('DOMContentLoaded', cargarUsuarios);
</script>

</body>
</html>
