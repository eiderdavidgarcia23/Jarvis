<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<style>
  body {
    background: #0a0e1a;
    color: #00e5ff;
    font-family: 'Courier New', monospace;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    text-align: center;
    padding: 15px;
    font-size: 24px;
    letter-spacing: 4px;
    border-bottom: 1px solid #00e5ff44;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
  }
  .msg {
    margin: 10px 0;
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 80%;
    line-height: 1.4;
  }
  .user {
    background: #1a2332;
    margin-left: auto;
    text-align: right;
    color: #ffffff;
  }
  .jarvis {
    background: #00e5ff11;
    border: 1px solid #00e5ff33;
    color: #00e5ff;
  }
  #inputArea {
    display: flex;
    padding: 12px;
    border-top: 1px solid #00e5ff44;
    gap: 8px;
  }
  #texto {
    flex: 1;
    background: #1a2332;
    border: 1px solid #00e5ff44;
    color: white;
    padding: 10px;
    border-radius: 6px;
    font-size: 16px;
  }
  button {
    background: #00e5ff;
    color: #0a0e1a;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
  }
  button:active { opacity: 0.7; }
</style>
</head>
<body>

<header>J.A.R.V.I.S.</header>
<div id="chat"></div>

<div id="inputArea">
  <button id="btnVoz">🎤</button>
  <input type="text" id="texto" placeholder="Habla con Jarvis...">
  <button id="btnEnviar">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const texto = document.getElementById('texto');
const btnEnviar = document.getElementById('btnEnviar');
const btnVoz = document.getElementById('btnVoz');

function agregarMensaje(texto, clase) {
  const div = document.createElement('div');
  div.className = 'msg ' + clase;
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function hablar(texto) {
  const utter = new SpeechSynthesisUtterance(texto);
  utter.lang = 'es-ES';
  speechSynthesis.speak(utter);
}

async function enviarMensaje() {
  const mensaje = texto.value.trim();
  if (!mensaje) return;
  agregarMensaje(mensaje, 'user');
  texto.value = '';

  agregarMensaje('...', 'jarvis');
  const ultimoMsg = chat.lastElementChild;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje })
    });
    const data = await res.json();
    ultimoMsg.textContent = data.respuesta;
    hablar(data.respuesta);
  } catch (err) {
    ultimoMsg.textContent = 'Error al conectar con Jarvis.';
  }
}

btnEnviar.addEventListener('click', enviarMensaje);
texto.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') enviarMensaje();
});

// Reconocimiento de voz
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = 'es-ES';
  recognition.interimResults = false;

  btnVoz.addEventListener('click', () => {
    recognition.start();
    btnVoz.textContent = '🔴';
  });

  recognition.onresult = (event) => {
    const dicho = event.results[0][0].transcript;
    texto.value = dicho;
    enviarMensaje();
  };

  recognition.onend = () => { btnVoz.textContent = '🎤'; };
} else {
  btnVoz.style.display = 'none';
}
</script>

</body>
</html>
